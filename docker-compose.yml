services:
  proxy_pool:
    image: ghcr.io/blissky/proxy_pool:latest
    pull_policy: always
    container_name: proxy_pool
    restart: unless-stopped
    ports:
      # Nginx on the host publishes these ports externally.
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    environment:
      # Redis connection used by the sync manager, Web console and forwarder.
      DB_CONN: "redis://@127.0.0.1:6379/0"
      # HTTP/SOCKS5 forwarding listener and Web control-panel port.
      PROXY_LISTEN: "0.0.0.0"
      PROXY_PORT: "8082"
      STATS_PORT: "8083"
      # Minimum interval between source refreshes, in seconds (3600 = 1 hour).
      FETCH_INTERVAL_SECONDS: "3600"
      # Full sync and availability detection interval, in seconds (600 = 10 minutes).
      CHECK_INTERVAL_SECONDS: "600"
      # HTTP target used to decide whether a proxy is available.
      HTTP_URL: "http://httpbin.org"
      # HTTPS target used with certificate verification to set the TLS capability flag.
      HTTPS_URL: "https://www.bing.com"
      # Per-target availability check timeout, in seconds.
      VERIFY_TIMEOUT: "5"
      # Maximum parallel temporary sing-box processes used for node checks.
      # The active formal sing-box process is not included.
      SING_BOX_CHECK_CONCURRENCY: "64"
      # Fixed sing-box runtime binary and generated configuration directory.
      SING_BOX_BINARY: "sing-box"
      SING_BOX_RUNTIME_DIR: "/data/sing-box"
      # Persistent Web configuration and runtime data directory.
      DATA_DIR: "/data"
      CONFIG_FILE: "/data/config.json"
      # Optional front proxy; leave empty to connect directly.
      FRONT_PROXY: ""
    volumes:
      - ./data:/data
