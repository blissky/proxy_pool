services:
  proxy_pool:
    image: ghcr.io/blissky/proxy_pool:latest
    pull_policy: always
    container_name: proxy_pool
    restart: unless-stopped
    ports:
      # Nginx on the host publishes these ports externally.
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    environment:
      # Redis connection used by the sync manager, Web console and forwarder.
      DB_CONN: "redis://@127.0.0.1:6379/0"
      # HTTP/SOCKS5 forwarding listener and Web control-panel port.
      PROXY_LISTEN: "0.0.0.0"
      PROXY_PORT: "8082"
      STATS_PORT: "8083"
      # Client handshake, upstream connection and blocked-write timeout, in seconds.
      PROXY_TIMEOUT: "5"
      # Consecutive connection failures before a node is removed from runtime selection.
      FAIL_THRESHOLD: "2"
      # Web control-panel access token. Change this before exposing port 8083.
      WEBUI_ACCESS_TOKEN: "sk-change-me"
      # Require a new login after this many seconds without user activity.
      WEBUI_SESSION_TIMEOUT_SECONDS: "1800"
      # Source refresh interval after each fetch finishes, in seconds (21600 = 6 hours).
      FETCH_INTERVAL_SECONDS: "21600"
      # Availability sync interval after each check finishes, in seconds (3600 = 1 hour).
      CHECK_INTERVAL_SECONDS: "3600"
      # HTTP fallback target used to decide availability only when the HTTPS check fails.
      HTTP_URL: "http://httpbin.org"
      # HTTPS target checked first with certificate verification; failure falls back to HTTP_URL.
      HTTPS_URL: "https://www.bing.com"
      # Per-target availability check timeout, in seconds.
      VERIFY_TIMEOUT: "5"
      # Maximum node probes sharing the single checker sing-box process.
      # The checker and active formal process are not counted as probe workers.
      SING_BOX_CHECK_CONCURRENCY: "16"
      # Fixed sing-box runtime binary and generated configuration directory.
      SING_BOX_BINARY: "sing-box"
      SING_BOX_RUNTIME_DIR: "/data/sing-box"
      # Persistent Web configuration and runtime data directory.
      DATA_DIR: "/data"
      CONFIG_FILE: "/data/config.json"
      # Optional front proxy for source downloads, checks and formal node connections.
      # Leave empty to connect directly; set a URL to route all three paths through it.
      FRONT_PROXY: ""
    volumes:
      - ./data:/data
