<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProxyPool 登录</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#101418;color:#d5d9de;font:14px system-ui,"Microsoft YaHei",sans-serif}.login{width:min(100%,360px);background:#171c22;border:1px solid #303840;border-radius:7px;padding:24px}h1{margin:0 0 22px;color:#70b7ff;font-size:21px;letter-spacing:0}label{display:block;margin-bottom:7px;color:#aeb7c0;font-size:12px}input{width:100%;height:40px;border:1px solid #3a4651;border-radius:5px;background:#0f1317;color:#e6edf3;padding:0 11px;font:14px ui-monospace,monospace;outline:none}input:focus{border-color:#2994df;box-shadow:0 0 0 2px rgba(41,148,223,.18)}button{width:100%;height:40px;margin-top:12px;border:0;border-radius:5px;background:#1677d2;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{min-height:20px;margin-top:10px;color:#fa6b6b;font-size:12px}
</style>
</head>
<body>
<main class="login">
<h1>ProxyPool</h1>
<form id="form">
<label for="token">Access Token</label>
<input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
<button id="submit" type="submit">登录</button>
<div class="error" id="error" role="alert" aria-live="polite"></div>
</form>
</main>
<script>
const form=document.getElementById('form'),token=document.getElementById('token'),submit=document.getElementById('submit'),error=document.getElementById('error');
form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;error.textContent='';try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token.value})});if(!response.ok){error.textContent='Access Token 无效';token.select();return}location.replace('/')}catch(e){error.textContent='无法连接到控制面板'}finally{submit.disabled=false}};
</script>
</body>
</html>
