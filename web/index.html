<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProxyPool 控制台</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#101418;color:#d5d9de;font:14px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto}.bar,.panel{background:#171c22;border:1px solid #303840;border-radius:7px;padding:15px;margin-bottom:14px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;color:#70b7ff;margin:0}.muted{color:#8b949e;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:5px;padding:8px 13px;color:white;background:#1677d2;cursor:pointer}.btn.secondary{background:#303840}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.stat{background:#0f1317;border:1px solid #242b32;border-radius:5px;text-align:center;padding:10px}.stat b{display:block;font:700 20px ui-monospace,monospace;color:#70b7ff}.stat b.good{color:#42c77a}.stat b.bad{color:#fa6b6b}.stat span{display:block;margin-top:4px;color:#8b949e;font-size:11px}.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.status>div{padding:9px;background:#0f1317;border:1px solid #242b32;border-radius:5px}.status strong{display:block;margin-top:4px;color:#e6edf3}.progress{height:8px;background:#0f1317;border-radius:5px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#2994df;width:0;transition:width .2s}.logs{height:260px;overflow:auto;background:#0f1317;border:1px solid #303840;border-radius:5px;padding:8px 10px;font:12px/1.6 ui-monospace,monospace}.info{color:#9ba7b3}.warn{color:#dbac54}.error{color:#fa6b6b}a{color:#70b7ff;text-decoration:none}
</style>
</head>
<body>
<main class="wrap">
<section class="bar"><div><h1>ProxyPool 控制台</h1><div class="muted">8082 对外代理入口 · 8083 管理界面 · sing-box 多协议出口</div></div><div class="actions"><button class="btn" id="sync">立即同步</button><a class="btn secondary" href="/pool.html">节点列表</a></div></section>
<section class="panel"><div class="grid" id="stats"></div></section>
<section class="panel"><div class="status"><div>同步状态<strong id="syncState">加载中</strong><div class="progress"><i id="progress"></i></div></div><div>正式 sing-box<strong id="boxState">加载中</strong></div><div>存储状态<strong id="redisState">加载中</strong></div><div>下一次同步<strong id="nextSync">-</strong></div></div></section>
<section class="panel"><div class="muted">实时日志</div><div class="logs" id="logs"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let seq=0;
function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(d){const c=d.redis?.count||{};const cards=[['total','已入库节点',''],['synced','当前已同步','good'],['tls','支持 TLS','good'],['source_count','代理源数量','']];$('stats').innerHTML=cards.map(x=>`<div class="stat"><b class="${x[2]}">${x[0]==='source_count'?(d.source_count??0):(c[x[0]]??0)}</b><span>${x[1]}</span></div>`).join('');const s=d.status||'idle';const p=d.total?Math.round((d.current||0)*100/d.total):0;$('syncState').textContent=`${s} · ${d.phase||'idle'} (${d.current||0}/${d.total||0})`;$('progress').style.width=p+'%';const b=d.singbox||{};$('boxState').textContent=b.running?`运行中 · 端口 ${b.port} · ${b.revision}`:`未就绪${b.error?' · '+b.error:''}`;$('redisState').textContent=d.redis?.ok?'连接正常':'连接失败';const left=Math.max(0,Math.ceil((d.next_sync||0)-Date.now()/1000));$('nextSync').textContent=left?`${left} 秒后`:'待同步'}
async function load(){try{const r=await fetch('/stats');render(await r.json())}catch(e){$('syncState').textContent=e.message}}
async function logs(){const r=await fetch('/logs?since='+seq);const d=await r.json();for(const x of d.logs||[]){const line=document.createElement('div');line.className=x.level.toLowerCase();line.innerHTML=`#${x.seq} ${esc(x.msg)}`;$('logs').appendChild(line);seq=Math.max(seq,x.seq)}while($('logs').childNodes.length>800)$('logs').removeChild($('logs').firstChild);$('logs').scrollTop=$('logs').scrollHeight}
$('sync').onclick=async()=>{const r=await fetch('/sync',{method:'POST'});if(r.status===409){alert('同步任务正在运行')}};load();logs();setInterval(load,1500);setInterval(logs,1200)
</script>
</body>
</html>
