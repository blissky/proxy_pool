<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProxyPool 节点</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#101418;color:#d5d9de;font:14px system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:20px;color:#70b7ff;margin:0}a{color:#70b7ff;text-decoration:none}.table{background:#171c22;border:1px solid #303840;border-radius:7px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1180px}th,td{padding:9px 11px;border-bottom:1px solid #252c33;text-align:left;font-size:12px}th{position:sticky;top:0;background:#0f1317;color:#8b949e}.mono{font-family:ui-monospace,monospace}.yes{color:#42c77a}.no{color:#fa6b6b}.tag{display:inline-block;padding:2px 6px;border-radius:4px;background:#303840;color:#d5d9de}.empty{text-align:center;color:#8b949e;padding:35px}
</style></head><body><main class="wrap"><div class="top"><h1>代理节点</h1><a href="/">返回控制台</a></div><div class="table"><table><thead><tr><th>协议</th><th>端点</th><th>TLS</th><th>已同步</th><th>来源</th><th>地区</th><th>检测次数</th><th>最近状态</th><th>最近检测</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></main>
<script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('/pool');const d=await r.json();$('body').innerHTML=d.items?.length?d.items.map(x=>`<tr><td><span class="tag">${esc(x.protocol)}</span></td><td class="mono">${esc(x.proxy)}</td><td class="${x.tls?'yes':'no'}">${x.tls?'是':'否'}</td><td class="${x.synced?'yes':'no'}">${x.synced?'是':'否'}</td><td>${esc(x.source||'-')}</td><td>${esc(x.region||'-')}</td><td>${x.check_count||0}</td><td>${x.last_status?'可用':'不可用'}</td><td>${esc(x.last_time||'-')}</td><td><button data-id="${esc(x.node_id)}">删除</button></td></tr>`).join(''):'<tr><td colspan="10" class="empty">暂无节点</td></tr>'}document.body.onclick=async e=>{if(!e.target.matches('button[data-id]'))return;if(!confirm('确认删除此节点？'))return;await fetch('/pool/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:e.target.dataset.id})});load()};load();setInterval(load,3000)</script></body></html>
